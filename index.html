    </div>
</body>
<script>
function criarCoracao() {
    const coracao = document.createElement("div");

    coracao.innerHTML = "❤️";
    coracao.classList.add("coracao");

    coracao.style.left = Math.random() * window.innerWidth + "px";
    coracao.style.fontSize = (Math.random() * 15 + 15) + "px";
    coracao.style.animationDuration = (Math.random() * 5 + 10) + "s";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 15000);
}

// Cria um coração a cada 800ms
const chuvaCoracoes = setInterval(criarCoracao, 800);

// Para após 15 segundos
setTimeout(() => {
    clearInterval(chuvaCoracoes);
}, 15000);

</script>
